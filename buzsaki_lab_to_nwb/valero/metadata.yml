Subject:
  species: Mus musculus
  description:
    Homozygous CaMKIIa-Cre line T29-1 transgenic mice (Jackson Laboratory 005359) were crossed with homozygous Ai32
    mice (Jackson Laboratory 012569) to express channelrhodopsin2 (ChR2) in neurons expressing CaMKIIa in F1 hybrid
    mice.
