# The paper's cell types are in the lab's RatNN-finalType.mat (one code per unit: 1 putative pyramidal cell,
# 2 putative interneuron, 0 not classified), over every unit of the rat's recording days in the order of its session
# list, and within a day in shank and cluster order. The units of each day (in that order) are listed here, from the
# lab's RatNN-YYYYMMDD-CellIndex.mat (Rat08 to 2013-07-13, Rat09) or .spikes.cellinfo.mat (later Rat08 days, Rat10);
# they add up to the length of finalType for Rat09 (1,294) and Rat10 (1,138), and the day of each unit was checked
# against the published cell types of DANDI:000061 (Rat08-20130709 to 0713: 224 of 239 excitatory are code 1, 70 of
# 73 inhibitory are code 2) and against firing rates (code 2 faster than code 1 on every typed day).
# Rat08's finalType has 2,444 codes for 2,469 units: the first 12 days line up with it, and Rat08-20130722 has 152
# units for the 127 remaining codes. Which of its units the codes are for is not known, so that day is not typed.
# Rat11 has no finalType file on the lab's share.
