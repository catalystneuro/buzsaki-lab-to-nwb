NWBFile:
  experiment_description:
    Transformation of a spatial map across the hippocampal-lateral septal circuit. Silicon probe recordings in the
    lateral septum (LS) and the dorsal hippocampus (CA1 or CA3) of freely moving rats running alternation tasks on a
    circular maze or a linear track, with position tracked by OptiTrack or by head-mounted LEDs.
  related_publications:
    - https://doi.org/10.1016/j.neuron.2018.04.028
  experimenter:
    - Tingley, David
  institution: New York University
  lab: Buzsaki
  keywords:
    - lateral septum
    - hippocampus
    - CA1
    - CA3
    - theta phase coding
    - place cells
    - silicon probe
